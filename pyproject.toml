[project]
name = "polyvox"
version = "0.3.0"
description = "LoRA training and fast inference studio for VoxCPM"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "voxcpm",
    # torch / torchaudio come from one of the groups cu130 / cu126 / cpu below.
    "triton-windows~=3.8.0; sys_platform == 'win32'",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml",
    "soundfile",
    # Decodes m4a / video without a system FFmpeg (its wheels bundle FFmpeg).
    "av>=19",
    "silero-vad>=6.2.3",
    "rotary-embedding-torch>=0.9.1",
    "beartype>=0.22.9",
    "pyloudnorm>=0.2.0",
    "prodigyopt>=1.1.2",
    "prodigy-plus-schedule-free>=2.0.1",
    "loguru>=0.7.3",
    "torchdiffeq>=0.2.5",
    "cn2an>=0.5.24",
    "pypinyin>=0.55.0",
    "g2p-en>=2.1.0",
    "wordsegment>=1.3.1",
    "opencc>=1.4.2",
    "onnxruntime>=1.31.0",
    "torchmetrics>=1.9.0",
]

[project.scripts]
polyvox = "polyvox.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.16.10",
]
# PyTorch builds, one at a time (run.bat / run.sh pick one, see torch_variant.py):
# CUDA 13 for recent drivers and Turing (RTX 20) or newer, including Blackwell;
# CUDA 12.6 for older drivers and GPUs; ROCm 7.2 for AMD GPUs (Linux only);
# CPU otherwise. Linux builds bring their own Triton.
cu130 = ["torch>=2.14.1", "torchaudio>=2.11"]
cu126 = ["torch>=2.14.1", "torchaudio>=2.11"]
rocm = ["torch>=2.14.1", "torchaudio>=2.11", "triton-rocm"]  # triton-rocm: so its source below applies
cpu = ["torch>=2.14.1", "torchaudio>=2.11"]

[tool.uv]
default-groups = ["dev", "cu130"]
conflicts = [[{ group = "cu130" }, { group = "cu126" }, { group = "rocm" }, { group = "cpu" }]]
# voxcpm lists torchcodec, but nothing imports it: torchaudio.load / save, its
# only users, read and write through audio_io instead (no system FFmpeg needed).
# The marker never matches, so it is not installed.
override-dependencies = ["torchcodec; sys_platform == 'never'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polyvox"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Byte-identical copy of upstream's training script: never reformat it.
extend-exclude = ["src/polyvox/vendor"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
# Line length is the formatter's job; long strings and comments may stay.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# One-line fakes (e.g. a VAD) read better as lambdas.
"tests/**" = ["E731"]

[tool.ruff.lint.isort]
# The tests' own helper module sorts after the package, not with third parties.
known-local-folder = ["conftest"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter declarations are meant to be call defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.uv.sources]
# PyPI 2.0.3 predates generate(seed=...) and resolve_model_path; switch to
# "voxcpm>=2.0.4" from PyPI once a release includes them.
voxcpm = { git = "https://github.com/OpenBMB/VoxCPM", rev = "cce58a5b59303c9bd63d12f23afe6a49a4a80c59" }
torch = [
    { index = "pytorch-cu130", group = "cu130" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-rocm", group = "rocm" },
    { index = "pytorch-cpu", group = "cpu" },
]
torchaudio = [
    { index = "pytorch-cu130", group = "cu130" },
    { index = "pytorch-cu126", group = "cu126" },
    { index = "pytorch-rocm", group = "rocm" },
    { index = "pytorch-cpu", group = "cpu" },
]
# The ROCm build's Triton lives on PyTorch's ROCm index (PyPI has only an old pre-release).
triton-rocm = [{ index = "pytorch-rocm", group = "rocm" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
