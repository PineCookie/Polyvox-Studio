[project]
name = "voxcpm-studio"
version = "0.1.0"
description = "LoRA training and fast inference studio for VoxCPM"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "voxcpm",
    # Declared directly so the CUDA index below applies to them.
    "torch>=2.14.1",
    "torchaudio>=2.11",
    "triton-windows~=3.8.0; sys_platform == 'win32'",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pyyaml",
    "soundfile",
    "silero-vad>=6.2.3",
]

[project.scripts]
voxcpm-studio = "voxcpm_studio.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxcpm_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
# Byte-identical copy of upstream's training script: never reformat it.
extend-exclude = ["src/voxcpm_studio/vendor"]

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, pyupgrade, bugbear.
select = ["E", "W", "F", "I", "UP", "B"]
# Line length is the formatter's job; long strings and comments may stay.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# One-line fakes (e.g. a VAD) read better as lambdas.
"tests/**" = ["E731"]

[tool.ruff.lint.isort]
# The tests' own helper module sorts after the package, not with third parties.
known-local-folder = ["conftest"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter declarations are meant to be call defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Query"]

[tool.uv.sources]
# PyPI 2.0.3 predates generate(seed=...) and resolve_model_path; switch to
# "voxcpm>=2.0.4" from PyPI once a release includes them.
voxcpm = { git = "https://github.com/OpenBMB/VoxCPM", rev = "cce58a5b59303c9bd63d12f23afe6a49a4a80c59" }
torch = [{ index = "pytorch" }]
torchaudio = [{ index = "pytorch" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
