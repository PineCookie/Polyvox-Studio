name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    # The tests need no GPU (fake model loader and training worker), so they run
    # on the CPU build of PyTorch; the GPU builds are only checked to install.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --no-default-groups --group dev --group cpu
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync pytest
      - name: The GPU builds resolve for this platform
        shell: bash
        run: |
          groups="cu130 cu126"
          if [ "$RUNNER_OS" = "Linux" ]; then groups="$groups rocm"; fi
          for g in $groups; do uv sync --locked --dry-run --no-default-groups --group "$g"; done

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
