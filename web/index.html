<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%235b5bd6'/><path d='M7 16h2M11 11v10M15 7v18M19 11v10M23 14v4' stroke='white' stroke-width='2.4' stroke-linecap='round'/></svg>"
    />
    <title>VoxCPM Studio</title>
    <script>
      // The theme chosen with the toggle (ThemeToggle.tsx), applied before the first paint.
      try {
        const theme = localStorage.getItem('voxcpm-studio.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
